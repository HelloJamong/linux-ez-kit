################################################################################
# Keepalive Guardian - 헬스체크 환경 설정 파일
#
# 위치: /etc/keepalived/service_check.conf
# 목적: 서비스 장애 판정 및 Failback 기준 설정
#
# 주의: DB_PASSWORD 보안을 위해 파일 권한을 600으로 설정하세요
#       chmod 600 /etc/keepalived/service_check.conf
################################################################################

# ------------------------------------------------------------------------------
# 프로세스 체크 목록
# pgrep -f <process_name> 으로 실행 여부 확인
# 예시: PROCESS_LIST=(nginx mysqld java)
# ------------------------------------------------------------------------------
PROCESS_LIST=(nginx mysqld)

# ------------------------------------------------------------------------------
# 포트 체크 목록
# TCP 연결 가능 여부 확인 (타임아웃 2초)
# 예시: PORT_LIST=(80 443 3306)
# ------------------------------------------------------------------------------
PORT_LIST=(80 443 3306)

# ------------------------------------------------------------------------------
# DB 복제 상태 체크 설정
# DB_ENABLED=yes 인 경우 SHOW REPLICA STATUS 로 복제 상태 확인
# MariaDB/MySQL 클라이언트가 설치되어 있어야 합니다
# ------------------------------------------------------------------------------
DB_ENABLED=no
DB_HOST=127.0.0.1
DB_PORT=3306
DB_USER=healthcheck
DB_PASSWORD=

# ------------------------------------------------------------------------------
# Failback 설정
# FAILBACK_DELAY: Active 복구 후 VIP 원복 전 안정화 대기 시간 (초)
#                 최소 60초 이상 권장 (너무 짧으면 Failback이 빈번하게 발생)
# REPLICATION_LAG_LIMIT: DB 복제 지연 허용 임계값 (초)
#                        이 값을 초과하면 장애로 판정
# ------------------------------------------------------------------------------
FAILBACK_DELAY=300
REPLICATION_LAG_LIMIT=30

# ------------------------------------------------------------------------------
# 로그 설정
# LOG_FILE: 헬스체크 및 HA 이벤트 로그 파일 경로
# LOG_RETENTION_DAYS: 로그 보관 기간 (일)
# ------------------------------------------------------------------------------
LOG_FILE=/var/log/service_ha_check.log
LOG_RETENTION_DAYS=30
