################################################################################
# Keepalive Guardian - Non-interactive Installation Config
#
# Usage: sudo ./install.sh --config install.conf
#
# Notes:
#   - AUTH_PASSWORD must be identical on both servers
#   - Leave AUTH_PASSWORD empty to auto-generate during installation
#   - If storing DB passwords in this file, set file permission to 600:
#     chmod 600 install.conf
################################################################################

# ------------------------------------------------------------------------------
# Server role
# active  : MASTER server (holds VIP normally, priority 100)
# standby : BACKUP server (takes over VIP on failure, priority 90)
# ------------------------------------------------------------------------------
ROLE=active

# ------------------------------------------------------------------------------
# Virtual IP (VIP)
# Shared virtual IP address between Active and Standby servers
# Must be in the same subnet as the server IP and must not be in use
# ------------------------------------------------------------------------------
VIP=

# ------------------------------------------------------------------------------
# Network interface
# Interface name to bind VIP (e.g. ens18, eth0, bond0)
# Leave empty to auto-detect (first non-loopback interface)
# ------------------------------------------------------------------------------
VRRP_INTERFACE=

# ------------------------------------------------------------------------------
# Current server IP
# Leave empty to auto-detect from VRRP_INTERFACE
# ------------------------------------------------------------------------------
CURRENT_IP=

# ------------------------------------------------------------------------------
# Peer server IP
# IP address of the peer server in HA configuration
# (If this is Active server, enter Standby server IP and vice versa)
# ------------------------------------------------------------------------------
PEER_IP=

# ------------------------------------------------------------------------------
# Failover detection delay (seconds)
# Time from health check failure detection to VIP failover
# Minimum 2s, recommended 10s or more
# ------------------------------------------------------------------------------
FAILOVER_DELAY=10

# ------------------------------------------------------------------------------
# VRRP authentication password (max 8 characters)
# Must be identical on both Active and Standby servers
# Leave empty to auto-generate
#
# [Quote rules]
#   Alphanumeric only  → no quotes needed       e.g. AUTH_PASSWORD=KAGrd251
#   Special characters → use double quotes      e.g. AUTH_PASSWORD="KAG@2025"
#   Contains $         → use single quotes      e.g. AUTH_PASSWORD='pass$word'
#   Contains spaces    → use double quotes      e.g. AUTH_PASSWORD="my pass1"
#
# [Forbidden characters] / and & are not allowed (cause config generation errors)
#   AUTH_PASSWORD=pass/word  ← invalid
#   AUTH_PASSWORD=pass&word  ← invalid
#
# [Recommended] Use 8-character alphanumeric combination (no quotes, no errors)
#   e.g. AUTH_PASSWORD=KAGrd251
# ------------------------------------------------------------------------------
AUTH_PASSWORD=
