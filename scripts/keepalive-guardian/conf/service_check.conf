################################################################################
# Keepalive Guardian - Health Check Configuration
#
# Location: /etc/keepalived/service_check.conf
# Purpose:  Configure service failure detection and failback criteria
#
# Note: Set file permission to 600 to protect DB_PASSWORD
#       chmod 600 /etc/keepalived/service_check.conf
################################################################################

# ------------------------------------------------------------------------------
# Process check list
# Checks process existence via: pgrep -f <process_name>
# Example: PROCESS_LIST=(nginx mysqld java)
# ------------------------------------------------------------------------------
PROCESS_LIST=(nginx mysqld)

# ------------------------------------------------------------------------------
# Port check list
# Checks TCP connectivity (timeout 2s)
# Example: PORT_LIST=(80 443 3306)
# ------------------------------------------------------------------------------
PORT_LIST=(80 443 3306)

# ------------------------------------------------------------------------------
# DB replication check settings
# When DB_ENABLED=yes, checks replication status via SHOW REPLICA STATUS
# Requires MySQL/MariaDB client to be installed
# ------------------------------------------------------------------------------
DB_ENABLED=no
DB_HOST=127.0.0.1
DB_PORT=3306
DB_USER=healthcheck
DB_PASSWORD=

# ------------------------------------------------------------------------------
# Failback settings
# FAILBACK_DELAY: Stabilization wait time (seconds) before VIP is returned to Active
#                 Minimum 60s recommended (too short may cause frequent failbacks)
# REPLICATION_LAG_LIMIT: DB replication lag threshold in seconds
#                        Exceeding this value triggers a failure judgment
# ------------------------------------------------------------------------------
FAILBACK_DELAY=300
REPLICATION_LAG_LIMIT=30

# ------------------------------------------------------------------------------
# Log settings
# LOG_FILE: Path to health check and HA event log file
# LOG_RETENTION_DAYS: Log retention period in days
# ------------------------------------------------------------------------------
LOG_FILE=/var/log/service_ha_check.log
LOG_RETENTION_DAYS=30
