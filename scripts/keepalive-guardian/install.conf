################################################################################
# Keepalive Guardian - 비대화형 설치 설정 파일
#
# 사용법: sudo ./install.sh --config install.conf
#
# 주의:
#   - AUTH_PASSWORD 는 양쪽 서버에 동일한 값을 입력해야 합니다
#   - AUTH_PASSWORD 를 비워두면 설치 시 자동 생성됩니다
#   - 이 파일에 DB 패스워드를 저장하는 경우 파일 권한을 600으로 설정하세요
#     chmod 600 install.conf
################################################################################

# ------------------------------------------------------------------------------
# 서버 역할
# active  : MASTER 서버 (평상시 VIP 보유, 우선순위 100)
# standby : BACKUP 서버 (장애 시 VIP 인계, 우선순위 90)
# ------------------------------------------------------------------------------
ROLE=active

# ------------------------------------------------------------------------------
# Virtual IP (VIP)
# Active/Standby 두 서버가 공유할 가상 IP 주소
# 현재 서버 IP와 동일 대역이어야 하며, 사용 중이지 않은 IP여야 합니다
# ------------------------------------------------------------------------------
VIP=

# ------------------------------------------------------------------------------
# 네트워크 인터페이스
# VIP를 바인딩할 인터페이스 이름 (예: ens18, eth0, bond0)
# 비워두면 기본 인터페이스(첫 번째 non-loopback)로 자동 설정됩니다
# ------------------------------------------------------------------------------
VRRP_INTERFACE=

# ------------------------------------------------------------------------------
# 현재 서버 IP
# 비워두면 VRRP_INTERFACE 에서 자동 감지합니다
# ------------------------------------------------------------------------------
CURRENT_IP=

# ------------------------------------------------------------------------------
# 상대 서버 IP
# HA 구성 상대방 서버의 IP 주소
# (Active 서버라면 Standby 서버 IP, Standby 서버라면 Active 서버 IP)
# ------------------------------------------------------------------------------
PEER_IP=

# ------------------------------------------------------------------------------
# 장애 전환 감지 시간 (초)
# 헬스체크 실패 감지 후 VIP를 전환하기까지 걸리는 시간
# 최소 2초 이상, 권장 10초 이상
# ------------------------------------------------------------------------------
FAILOVER_DELAY=10

# ------------------------------------------------------------------------------
# VRRP 인증 패스워드 (최대 8자)
# Active/Standby 양쪽에 동일한 값을 입력해야 합니다
# 비워두면 자동 생성됩니다
#
# [따옴표 규칙]
#   영문+숫자 조합  → 따옴표 불필요     예) AUTH_PASSWORD=KAGrd251
#   특수문자 포함   → 큰따옴표로 묶기   예) AUTH_PASSWORD="KAG@2025"
#   $ 문자 포함     → 작은따옴표로 묶기 예) AUTH_PASSWORD='pass$word'
#   공백 포함       → 큰따옴표로 묶기   예) AUTH_PASSWORD="my pass1"
#
# [사용 불가 문자] / 와 & 는 사용 불가 (설정 파일 생성 시 오류 발생)
#   AUTH_PASSWORD=pass/word  ← X
#   AUTH_PASSWORD=pass&word  ← X
#
# [권장] 영문+숫자 8자 조합 사용 (따옴표 불필요, 오류 없음)
#   예) AUTH_PASSWORD=KAGrd251
# ------------------------------------------------------------------------------
AUTH_PASSWORD=
